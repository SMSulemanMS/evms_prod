{% extends "base.html" %}

{% block title %}Create Event - EVMS{% endblock %}
{% set is_admin_page = true %}

{% block admin_content %}
<div class="content-card">
    <h1>Create New Event</h1>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Event Title</label>
            <input type="text" name="title" required>
        </div>

        <div class="form-group">
            <label>Date & Time</label>
            <input type="datetime-local" name="date_time" required>
        </div>

        <div class="form-group">
            <label>Location (Google Maps URL)</label>
            <input type="text" name="location_url" placeholder="https://maps.google.com/..." required>
        </div>

        <div class="form-group">
            <label>Venue</label>
            <input type="text" name="location_text" placeholder="e.g. Sheraton Grand Doha" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="5" required></textarea>
        </div>



        <div class="form-group">
            <label>Event Banner</label>
            <input type="file" name="banner" accept="image/*">
        </div>

        <div class="form-group">
            <label>Event Logo</label>
            <input type="file" name="logo" accept="image/*">
        </div>

        <div class="form-group">
            <label>Bottom Banner / Footer Image</label>
            <p style="font-size: 0.8rem; color: #666; margin-top: -5px;">Upload a single banner image containing all
                partner logos.</p>
            <input type="file" name="bottom_banner" accept="image/*">
        </div>

        <div style="margin-top: 30px;">
            <button type="submit" class="btn">Publish Event</button>
            <a href="{{ url_for('main.admin_dashboard') }}" style="margin-left: 20px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
